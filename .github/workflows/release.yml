name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            # WiX/MSI light.exe fails on GitHub runners; NSIS matches custom installer UI.
            args: --bundles nsis
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GenCode ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install. Auto-update is built in."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify installers contain no embedded API keys
        run: node scripts/verify-no-secrets-in-artifacts.mjs dist src-tauri/target/release/bundle

      - name: Build portable (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/gencode.exe"
          if (Test-Path $exe) {
            $dest = "GenCode_${{ github.ref_name }}_x64-portable.zip"
            $staging = "portable-staging"
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            Copy-Item $exe "$staging/gencode.exe"
            Copy-Item scripts/register-context-menu.ps1 "$staging/"
            Copy-Item scripts/unregister-context-menu.ps1 "$staging/"
            Compress-Archive -Path "$staging/*" -DestinationPath $dest
            Write-Output "portable_zip=$dest" >> $env:GITHUB_ENV
            Write-Output "portable=yes" >> $env:GITHUB_ENV
          }

      - name: Upload portable to release
        if: env.portable == 'yes'
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" "${{ env.portable_zip }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

